name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android
      -       - name: Preparar icono
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert assets/06c41831656a90f3fbf898850b62c946.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 assets/icon-only.png


      - name: Generar iconos
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#111b21' --iconBackgroundColorDark '#111b21'
      - name: Permiso de micrófono
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-efimero-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
